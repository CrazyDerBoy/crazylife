a day later. It costs nerves.","The airline rebooks graciously. Compensation even comes on top.","Buy a new flight","A last-minute ticket saves the vacation, but not the bank account.","Let the vacation lapse","You drive home. The vacation is lost."],E183:["Backpacking Trip","A backpack, a plane ticket, no plan. The world is waiting.","Set off","Months full of adventure. You meet people who shape you for life.","Money worries and homesickness plague you, but in the end you are more mature than before.","Stay at home","You stay. Maybe later. The wanderlust remains, though."],E184:["Lost Luggage","Everything circles on the baggage belt, except your suitcase.","Buy new","You buy the essentials. The airline refunds part later.","Only annoyance remains, and the suitcase never arrives.","Wait","After three days the suitcase turns up. Lucky!","You wait and wait. The vacation is spoiled."],E185:["Concert Tickets","Your favorite band is coming to town! Presale starts in an hour.","Buy tickets","You snag seats in the third row. An unforgettable evening!","The concert is fantastic, only the drinks cost a fortune.","Too late, sold out","All gone after five minutes. You watch the concert on videos."],E186:["Gym Contract","The New Year's offer is tempting: twelve months of gym at a special price.","Sign up and stick with it","After months you feel it: more strength, better posture, better self-image.","You stick with it, but only on and off. Progress is modest.","Quit after two weeks","After two weeks you lose interest. The contract keeps running anyway.","Do not sign","You save the money. Jogging in the park helps too."],E187:["Marathon Sign-up","Forty-two kilometers. You spontaneously signed up for a marathon.","Train hard","You cross the finish line after four hours and cry with happiness. You made it!","At kilometer 30 you give up. Your body does not cooperate.","Give up","You let the training slide and withdraw."],E188:["New Hobby","Guitar, painting or photography. You feel like trying something new.","Learn with enthusiasm","You discover real talent! Friends and family are amazed.","It is really fun, even if you are not a genius.","Just try it out","After a few weeks the material gathers dust in the closet."],E189:["Club Promotion","On the last matchday it is decided whether your team goes up or down.","You get promoted! The clubhouse shakes and you embrace your teammates.","You stay in the league. Business as usual, with relief.","Relegation is sealed. Tears flow, but the team spirit stays."],E190:["Camping Mishap","The tent is up, the grill glows. Then the rain begins.","Constant rain all weekend. You laugh anyway and play cards in the tent.","A raccoon plunders your supplies. Breakfast is cancelled.","The storm tears the tent away. You flee to the nearest hotel."],E191:["Festival","Three days of mud, music and people. The festival is your thing.","Party all out","You meet people who will accompany you for years.","A weekend full of memories. Your body groans.","Your phone and wallet are gone. The mood stays high though.","Take it easy","You hear the bands from the edge. Relaxed and dry."],E192:["Talent Show","The audience is waiting, the spotlights are on you. Your performance begins.","Perform","Thunderous applause! A talent scout presses his card into your hand.","The audience claps politely. You had fun.","Boos from the back row. That cuts deep.","Chicken out","Stage fright wins. You stay in the audience and are annoyed."],E193:["Cooking Class","A cooking class with a top chef. You signed up on a whim.","Your menu works on the first try. Everyone is impressed, including you.","The sauce burns, but the chef laughs along. You learn a lot.","The kitchen is on fire! A pan and a towel have to pay for it."],E194:["Garden Project","Beds, tomatoes, herbs. You discovered your green thumb, or not.","A record harvest! The neighbor gets a basket too.","The slugs eat everything. Frustration and laughter at once.","The neighbors complain about your compost. The fence becomes a battlefield."],E195:["Adopt a Pet","At the animal shelter a pair of eyes looks at you and will not let go.","Adopt a dog","The dog becomes your best friend. Walks keep you fit and happy.","The dog is a whirlwind and wrecks half the apartment. You love him anyway.","Adopt a cat","The cat rules your life from now on, and you are more than happy with it.","Something exotic","An axolotl! Your new roommate gives people something to talk about.","The animal is more demanding than thought. It costs time and money.","Never mind","You leave the shelter empty-handed and heavy-hearted."]};var Pi={E196:["Lottery Win","The numbers on your ticket match. You read them three times, then sit there speechless.","Blow it all","Parties, trips, gifts. After a year almost everything is gone, but what a year!","You celebrate and shop, but luckily some is left over.","Invest wisely","You invest the money sensibly. It now works for you.","Your advisor guides you well. The wealth grows over the years.","Keep it secret","You tell nobody and live on as before. The money gives you quiet security."],E197:["Celebrity Encounter","Someone you know from TV is sitting in the caf\xE9. They are drinking an espresso.","Ask for a selfie","The person is friendly and poses. The photo stays with you for years.","An annoyed look and a no. You are a little ashamed.","Autograph","An autograph lands on a napkin. Your heart pounds.","Pretend not to notice","You act as if nothing is happening. Only later do you regret the missed chance."],E198:["Wallet Found","On the sidewalk lies a plump wallet. Nobody is watching.","Give it back","The owner is overjoyed and gives you a finder's reward.","You hand it in and simply feel good about it.","Keep it","You pocket the cash. It feels strange.","A camera saw everything. There is a report for misappropriation."],E199:["Prize Draw",'An email: "Congratulations, you won!" This time it seems to be real.',"A weekend at a wellness oasis! Exactly what you needed.","A voucher for \u20AC500. Shopping feels like Christmas.","The prize is a huge pile of promotional items nobody needs."],E200:["Mistaken Identity","A stranger addresses you enthusiastically. He takes you for someone else.","Clear it up","You laugh about it together. A nice moment.","He is embarrassed. You have a coffee together and chat for a long time.","Play along","You play the role. It becomes a crazy, fun evening.","The thing is exposed, and it gets embarrassing."],E201:["Old Friend Shows Up","After years without contact someone from your past gets in touch.","Meet up","As if no time had passed. You talk for hours.","You have grown apart. The meeting is polite, nothing more.","Ignore","You do not answer. Some chapters are better left closed."],E202:["Talent Scout","A man with a notepad has been watching you for a while. Then he speaks to you.","Accept the offer","He opens doors for you. Who knows where this leads.","It was a scam. You are left with the costs.","Decline","You politely decline. Who knows if it was a chance."],E203:["Mysterious Letter","In the mailbox lies an envelope without a sender. Only your name is on it.","Open it","A handwritten letter from an old acquaintance who apologizes.","An invitation to a mysterious party. It becomes an entertaining evening.","A blackmail letter! You go to the police, who investigate the case.","A joke by a friend, who is now laughing at you.","Throw it away","You throw the letter away. Sometimes a question stays unanswered."],E204:["Black Day","The coffee spills, the bus leaves, the account is empty. Everything goes wrong.","Eventually you laugh about the whole chaos. Tomorrow will be better.","It is a day to forget. Even the cat looks at you with pity."],E205:["Accidental Heroism","On the shore someone cries for help. Without thinking you jump in.","You rescue a person. The local paper prints your photo and the town honors you.","You rescue a dog, and the whole internet loves you for it.","You get hurt in the rescue, but everyone is saved."],E206:["Lost Heirloom","At the flea market you discover an old family piece that went missing long ago.","It is your grandfather's watch! You buy it back for a few euros.","An expert values the piece at several thousand euros. You do not sell it.","The dealer demands a fortune. You leave it, heavy-hearted."],E207:["Dream Apartment","Perfect location, fair price. The apartment is only open for viewing this week.","Seize it","You need at least \u20AC44,000 in equity","You sign immediately. The dream apartment is yours.","Hesitate","You think too long. On Monday the apartment is gone."],E208:["Bank Error","Suddenly there are \u20AC2,000 too much in your account. The bank apparently made a mistake.","Report it","You call the bank. The employee praises your honesty.","Keep it","Nobody notices. You have an uneasy feeling for two weeks.","The bank reverses everything and files a report."],E209:["Close Call","A roof tile crashes onto the sidewalk where you were walking a moment ago.","You tremble all over. Then you realize how beautiful life is.","The shock runs deep, but you see everything more clearly and live more consciously."],E210:["Midlife Crisis","Suddenly you question everything: the job, the home, your whole life.","Buy a sports car","You need \u20AC130,000","The wind in your hair, the road ahead. You feel 25 years younger.","The neighbors whisper. Your partner rolls their eyes.","Emigrate","You need \u20AC5,000","New continent, new life. You blossom.","Homesickness catches up with you, but you regret nothing.","Question everything","After some hard weeks you see more clearly. You reorganize your life.","You brood until you no longer recognize yourself. The crisis lasts months."]};var Ii={E211:["Video Goes Viral","A clip of you is shared, liked and commented on. Suddenly millions see it.","Use the fame","Ad requests, new followers, media inquiries. You ride the wave.","The hype is over after two weeks. At least a bit of money remains.","Protect your privacy","You delete the video and lie low. The excitement quickly settles."],E212:["Influencer Career","Your reach is growing. The first brands get in touch.","A lucrative ad deal lands in your account. Life is fun.","The pressure to post constantly wears you down. Your fame has a price.","Your follower count stagnates. The big breakthrough does not come."],E213:["Online Backlash","An old sentence of yours is dug up. Within hours a storm of outrage breaks loose.","Apologize","Your honest apology calms things. After a few days it is forgotten.","Some accept your apology, others do not. The wounds remain.","Defend yourself","Your stance wins supporters. The storm turns.","You pour oil on the fire. The backlash grows, and your boss is anything but pleased.","Lie low","You delete your profiles and wait. After a few weeks the excitement is over."],E214:["Crypto Hype","Everyone is talking about a new coin. Your colleague proudly shows you his portfolio.","Get in (\u20AC2,000)","You buy for 2,000 euros. The price first goes up, and your heart with it.","Wait","You watch from the sidelines. Time will tell whether that was wise.","Ignore","You have nothing to do with speculation."],E215:["Crypto Crash","Your price swings wildly. Your portfolio is a weather report of reds and greens.","Hold","The price recovers and rises far above your entry. You sell at a profit.","The value keeps falling. You lose almost everything.","Sell","You get out in time and leave with a slight profit.","You sell at a loss. Then the price rises, which is annoying.","Buy more","You need \u20AC2,000","Brave! The price turns and you triple your money.","The crash continues. You lose your entire stake."],E216:["Gig Job","Delivery or ride-hailing: the app promises quick money with no fixed hours.","Accept","The money comes quickly, but the job wears you out. There is no safety net.","Your back hurts, weather and traffic annoy you. In the end little remains.","Decline","You pass and keep looking for something permanent."],E217:["Phishing Email",'Your bank writes: "Your account will be blocked!" The link looks deceptively real.',"Report it","You recognize the fake and report the email. Good reaction.","Click","Luckily the sender was not as clever as thought, and nothing happens.","Your login details are gone and your account is plundered."],E218:["Account Hacked","A notification: strangers have logged into your account.","Change passwords","You act quickly. The damage stays small.","Too late: part of your money is already gone.","Call the bank","The bank blocks everything immediately and refunds the damage.","The hotline hangs in the queue forever. It costs you nerves and money."],E219:["Data Breach","A service you are a customer of was hacked. Your data is online.","Switch provider","You switch to a more secure service and change all passwords. Tedious, but right.","Wait and see","Nothing happens. You were lucky.","Spam and scam attempts pile up. A real nightmare."],E220:["Remote Job Offer","A company offers you a job entirely from home, from anywhere in the world.","Accept","Freedom pure! You work from the beach, the caf\xE9 or the sofa.","In the long run it gets lonely. Colleagues are just faces on a screen.","Decline","You stay where you are. Office is office, but you know the people."],E221:["AI Replaces Tasks",'At work software is taking over more and more of your tasks. Your boss says: "We need to talk."',"Retrain","That costs about \u20AC1,500","You learn new skills and become indispensable in the team.","The training is hard but brings only a small plus.","Ignore it","Your job luckily stays largely untouched.","Your area of responsibility shrinks, and you are laid off.","Profit from it","You use the tools cleverly and become more productive than everyone else.","You rely on them too much and make embarrassing mistakes."],E222:["Dating Scam","The perfect person has been writing to you for weeks. Suddenly they urgently need money.","Spot the scam","Something smells fishy. You research, block the contact and are relieved.","Pay","You transfer the money. Afterwards the person has vanished. That hurts twice.","You pay, but notice in time and can stop the transfer."],E223:["Streaming Debut","Your first livestream. The counter shows a single viewer: your mother.","Push through","Your chat grows, the community loves you. The start of a career?","A few nice people watch regularly. It is fun.","Haters flood the chat. That hits you harder than you thought.","Cancel","You switch off. Maybe another time."],E224:["Order Never Arrives","You ordered something online, and it simply does not arrive.","Complain","Support gets in touch and sends a replacement.","A week of emails with canned responses. In the end only a voucher.","Chargeback","Your bank reverses the payment. Fine.","Write it off","You cannot be bothered. The money is gone."],E225:["Smart Home Glitch","The lights dance, the heating strikes, and the voice assistant plays polka at three in the morning.","A restart fixes everything. You laugh about the chaos.","A technician has to come. He finds a simple error and still charges 150 euros.","You rip everything out and go back to simple switches."],E226:["Digital Detox","A week without a phone. Your friend talks you into this experiment.","Stick with it","After the first days it gets quiet and pleasant. You sleep better and think more clearly.","You hold on, but withdrawal gnaws at you. You are proud anyway.","Quit after one day","You cannot stand it and switch the phone back on."],E227:["Old Post Resurfaces","An embarrassing post from your youth is suddenly shared. Your face is plastered in close-up.","Delete it","You delete everything. Too late: the screenshots are already circulating.","You catch it in time and it goes unnoticed.","Own it","You laugh at yourself. People love it, and it takes on a life of its own.","Some react mockingly. You stand by your past anyway."],E228:["Online Side Business","Dropshipping or your own shop: you have a business idea that could run on the side.","Get started","Your shop is a hit! Every month a nice extra income lands with you.","Ups and downs. In the end a small profit and plenty of experience remain.","The goods stay on the shelf, customers stay away. You lose your stake.","Skip it","The idea gathers dust in a note on your phone."]};var Bi={E229:["Retirement","Colleagues bake cake, the boss gives a speech. Your last day at work has come. What now?","Retire early","You say goodbye to alarm clocks and meetings. The pension is smaller, but the freedom is worth it.","The first weeks are wonderful, then boredom sets in. You look for a task.","Work until the regular retirement age","You keep working. The work keeps you fit and busy.","Work becomes a burden. Your back acts up every morning."],E230:["Pension Not Enough","At the end of the month hardly anything is left. Prices rise faster than the pension.","Find extra income","A small side job in the neighborhood tops up your funds and keeps you fit.","The extra work is tiring, but it brings a little breathing room.","Save","You cut back, give up some pleasures and get by.","Apply for help","The office approves basic security. A burden falls from your shoulders.","The paperwork is annoying, and the application is only approved after months."],E231:["Care Decision","Stairs become a challenge, housework a burden. The question of the right way to live is in the air.","Stay at home with a care service","That costs about \u20AC3,000 per year","You stay in your own four walls. The care service visits daily and you feel well.","The care service is often overloaded. It works, if bumpily.","Move into a nursing home","The home is cozier than expected. You find new friends for cards and chess.","Leaving the old apartment hurts. Settling in takes a long time.","Move in with family","You need children for that","A room in your children's house. You are never alone, and the grandchildren romp through the house.","Close living together brings friction. You get to know each other anew."],E232:["Grandchildren Visit","The grandchildren are visiting for the weekend. The house is full of noise, cookies and laughter.","A weekend full of energy. You bake, play and laugh. Your heart is overflowing.","It was a wild day. You are exhausted, but happy."],E233:["Writing Memoirs","Your life is full of stories. You sit down and start writing them down.","Write it down","The book becomes a treasure for your family. They read it again and again.","You write for a while, then put the pen down. The thoughts remain, though.","Keep memories to yourself","Some stories belong only to you."],E234:["Fall at Home","A slippery rug, a wrong step. You lie on the floor and cannot get up alone.","Just a shock and a bruise. You install grab bars.","The hip is broken. Surgery, rehab, a walker.","After the fall you do not recover properly. You stay bedridden for a long time.","The complications after the fall are too severe. You die in the hospital."],E235:["Forgetfulness","Where are my glasses? What was the neighbor's name again? The gaps in your head are growing.","See a doctor","The doctor reassures you: age-related, no cause for concern.","The diagnosis is early dementia. With therapy the course can be slowed.","Tell the family","You need children for that","Your children take care of you lovingly. You feel supported.","They are worried, but also overwhelmed. There is an argument over the right solution.","Suppress it","You push the thoughts aside. It does not get better.","It is probably just a phase and will pass."],E236:["A Quiet House","The place next to you stays empty. The house is so quiet that you hear the clock ticking.","Accept support","Family and friends carry you through the grief. You are not alone.","The help does you good, but the gap remains.","Withdraw","You retreat into your shell. The days pass gray.","With time you find your own rhythm again."],E237:["Milestone Birthday","A birthday with a round number. The family has come up with something.","A huge celebration, cake, speeches and tears of emotion. You are the center of attention.","The celebration is quieter than you thought. But it is a lovely day."],E238:["Writing a Will","You want to create clarity: who should get what in the end?","Divide fairly","Everyone gets the same. The will brings peace to the family.","Despite all fairness there are the envious. You hope for insight.","Favor someone","Your favorite is quietly happy. The others only find out later.","The family finds out and a bitter argument breaks out.","Donate","You provide for a foundation. It is a proud feeling to leave something behind."],E239:["Trip of a Lifetime","One more time to the other end of the world. The suitcase already stands packed in the hallway.","Set off","The trip becomes unforgettable. You return with shining eyes and a thousand stories.","The strain takes its toll. But you regret nothing.","An incident abroad ends in the hospital. You come home safe but exhausted.","Stay at home","You stay. Other people's photos will have to do."],E240:["Bucket List","You write down what you still want to experience. And whom you still want to call once more.","Tick off wishes","You fulfill small and big dreams. Every tick on the list makes you happier.","Not everything works out, but the attempt counts.","Seek reconciliation","After years of silence you talk again. A burden falls from you.","The call is not returned. You tried, and that counts.","Live in peace","You lean back and enjoy the here and now. It is good as it is."]};var o=(e,t,a={},r={})=>({w:e,t,fx:Object.keys(a).length?{stats:a,...r}:{...r}}),u=(e,t,a,r)=>({l:e,o:t,...a?{req:a}:{},...r?{hint:r}:{}});function c(e){let t=[e.title[1],e.text[1]],a=l=>(t.push(l.t[1]),{weight:l.w,text:l.t[0],effects:l.fx}),r={id:e.id,category:e.cat,title:e.title[0],text:e.text[0],ageMin:e.age[0],ageMax:e.age[1],...e.w!==void 0?{weight:e.w}:{},...e.chance!==
