<!doctype html>

<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>CrazyLife</title>
<style>:root {
  --bg: #070b14;
  --card: #0f1521;
  --card2: #121a2a;
  --line: #1c2740;
  --text: #f1f5f9;
  --muted: #8b93a7;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --green: #34d399;
  --red: #f43f5e;
  --amber: #fbbf24;
  --grad: linear-gradient(135deg, #a855f7, #22d3ee);
  --tabh: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #03050a; color-scheme: dark; color: var(--text); font: 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
body { display: flex; align-items: center; justify-content: center; }
#app { position: relative; width: 100%; max-width: 440px; height: 100%; max-height: 920px; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 520px) { #app { border-radius: 32px; border: 1px solid #141c2e; box-shadow: 0 0 80px rgba(80,60,160,.15); } }

.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
.screen::-webkit-scrollbar { width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; min-height: 52px; }
.topbar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; text-align: center; flex: 1; }
.topbar .sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.topbar .ic { width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; color: var(--text); opacity: .9; }
.topbar .ic.spacer { visibility: hidden; }
.logo { font-size: 21px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

.card { position: relative; background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1px solid transparent;
  background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, #a855f766, #22d3ee55); background-origin: border-box; background-clip: padding-box, border-box; }
.card.plain { background-image: none; border-color: var(--line); }
.card.row { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
.card.row .grow { flex: 1; min-width: 0; }
.card.row .chev { color: var(--muted); font-size: 18px; }
.card.red { background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, #f43f5e99, #7f1d1d66); }
.card.gold { background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, #fbbf24aa, #b4530966); }
.card.locked { opacity: .5; }
.t { font-weight: 700; }
.s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.icobox { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 23px; background: #1a2238; flex: none; }
.icobox.big { width: 56px; height: 56px; font-size: 30px; border-radius: 16px; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); text-transform: uppercase; margin: 16px 2px 8px; }
.label.c-purple { color: #c084fc; } .label.c-cyan { color: #67e8f9; } .label.c-green { color: #6ee7b7; } .label.c-amber { color: #fcd34d; } .label.c-red { color: #fb7185; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .6px; padding: 2px 7px; border-radius: 5px; margin-left: 6px; vertical-align: middle; border: 1px solid; }
.chip.low { color: #4ade80; border-color: #166534; } .chip.mid { color: #fbbf24; border-color: #854d0e; } .chip.high { color: #f87171; border-color: #991b1b; } .chip.soon { color: #c084fc; border-color: #6b21a8; }
.btn { display: block; width: 100%; text-align: center; font-weight: 800; letter-spacing: .5px; padding: 15px 16px; border-radius: 14px; background: linear-gradient(135deg, #8b3cf5, #a855f7); box-shadow: 0 6px 24px rgba(168,85,247,.35); text-transform: uppercase; font-size: 14px; }
.btn.cyan { background: linear-gradient(135deg, #7c3aed, #22d3ee); }
.btn.ghost { background: transparent; box-shadow: none; border: 1px solid var(--line); color: var(--muted); }
.btn.sm { padding: 10px 14px; font-size: 12.5px; }
.btn[disabled], .btn.off { opacity: .4; box-shadow: none; }
.pill { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; letter-spacing: .5px; display: inline-block; }
.pill.buy { background: #0f3a2c; color: #34d399; } .pill.no { background: #3b1018; color: #fb7185; } .pill.fin { background: #1e2a55; color: #93c5fd; }
.green { color: var(--green); } .red-t { color: var(--red); } .amber { color: var(--amber); }
.bar { height: 7px; border-radius: 4px; background: #1a2238; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; }

/* Start */
.profile { display: flex; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #6d4cf0, #22a5f7); display: grid; place-items: center; font-size: 36px; flex: none; }
.pname { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.pname button { font-size: 14px; opacity: .8; }
.money { font-size: 20px; font-weight: 800; color: var(--green); margin-top: 2px; }
.money.neg { color: var(--red); }
.stat { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.stat .n { width: 100px; display: flex; gap: 8px; align-items: center; }
.stat .bar { flex: 1; }
.stat .v { width: 42px; text-align: right; font-weight: 700; font-size: 13px; }
.diary h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: 1.4px; color: var(--muted); font-weight: 700; }
.diary li { list-style: none; position: relative; padding-left: 14px; margin: 7px 0; font-size: 13.5px; color: #dbe3f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.diary li::before { content: ''; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); }
.diary ul { margin: 0; padding: 0; }
.age-btn { margin: 14px 0 12px; }
.duo { display: flex; gap: 10px; }
.duo > * { flex: 1; }
.tilebtn { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.tilebtn.green { border-color: #14634a; background: linear-gradient(135deg, #0e2b25, #0f1521); }
.tilebtn.purple { border-color: #5b2a9a; background: linear-gradient(135deg, #1f1340, #0f1521); }

/* Tabbar */
.tabbar { flex: none; height: var(--tabh); display: flex; background: #0a0f1b; border-top: 1px solid #151d30; padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; color: #6b7389; text-align: center; }
.tabbar button .e { font-size: 21px; filter: grayscale(1) opacity(.65); }
.tabbar button.on { color: #c084fc; } .tabbar button.on .e { filter: none; }

/* Grid tiles */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: 16px; padding: 14px; min-height: 100px; border: 1px solid; border-color: transparent; background-image: linear-gradient(var(--card), var(--card)), linear-gradient(135deg, #a855f766, #22d3ee55); background-origin: border-box; background-clip: padding-box, border-box; width: 100%; }
.tile .icobox { margin-bottom: 8px; }
.tile.off { opacity: .55; }

/* Menu */
.menu { background: radial-gradient(900px 500px at 20% 0%, #3b1e7a55, transparent 60%), radial-gradient(700px 500px at 100% 100%, #0e7c8a40, transparent 60%), var(--bg); }
.menu .screen { display: flex; flex-direction: column; }
.hero { text-align: center; padding: 22px 0 14px; }
.nslogo { width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 24px; background: linear-gradient(135deg, #1b1f4a, #3b1e7a 60%, #0e7c8a); display: grid; place-items: center; font-weight: 900; font-size: 36px; box-shadow: 0 8px 40px rgba(124, 58, 237, .4); border: 1px solid #3a3f7a; }
.nslogo small { display: block; font-size: 9px; letter-spacing: 4px; font-weight: 600; color: #9aa3d6; margin-top: -4px; }
.biglogo { font-size: 42px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.5px; }
.tagline { letter-spacing: 3.5px; font-size: 11px; color: #8b93a7; margin-top: 4px; }
.cont { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #11182b; border: 1.5px solid #5ea0ff; box-shadow: 0 0 22px rgba(94,160,255,.25); width: 100%; margin: 14px 0 12px; }
.play { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8b3cf5, #6366f1); display: grid; place-items: center; }
.menu .grid2 { margin-top: 2px; }
.menu .tile { min-height: 104px; background-image: linear-gradient(#10182b, #10182b), linear-gradient(135deg, #a855f788, #22d3ee88); }
.ver { text-align: center; color: #4b5470; font-size: 10.5px; letter-spacing: 2.5px; margin-top: auto; padding-top: 22px; }

/* Loading */
.loading { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: radial-gradient(700px 520px at 25% 15%, #3b1e7a88, transparent 60%), radial-gradient(600px 500px at 90% 90%, #0e7c8a77, transparent 60%), radial-gradient(500px 400px at 5% 75%, #5a1a2f66, transparent 60%), #05070d; padding: 0 40px; position: relative; }
.loading .barwrap { position: absolute; left: 40px; right: 40px; bottom: 140px; }
.loading .barwrap .meta { display: flex; justify-content: space-between; font-size: 13px; color: #b6bdd0; margin-top: 10px; }
.loading .copy { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; letter-spacing: 3px; font-size: 11px; color: #4b5470; }

/* Sheet / modal */
.scrim { position: absolute; inset: 0; background: rgba(2,4,10,.72); display: flex; align-items: flex-end; z-index: 20; animation: fade .18s ease; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: #0d1320; border: 1px solid #1d2842; border-bottom: 0; border-radius: 26px 26px 0 0; padding: 12px 18px 22px; animation: up .22s ease; }
.sheet .grab { width: 44px; height: 4px; border-radius: 3px; background: #2a3555; margin: 0 auto 14px; }
.sheet .icn { width: 72px; height: 72px; border-radius: 20px; margin: 4px auto 10px; display: grid; place-items: center; font-size: 38px; background: linear-gradient(135deg, #6d4cf0, #22a5f7); box-shadow: 0 8px 30px rgba(99,102,241,.4); }
.sheet .icn.good { background: linear-gradient(135deg, #10b981, #22d3ee); } .sheet .icn.bad { background: linear-gradient(135deg, #f43f5e, #f97316); }
.sheet .when { text-align: center; font-size: 11.5px; font-weight: 800; letter-spacing: 1.8px; color: #c084fc; }
.sheet h2 { text-align: center; margin: 4px 0 8px; font-size: 21px; }
.sheet p.body { text-align: center; color: #c5cde0; margin: 0 0 16px; font-size: 14.5px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 14px; font-weight: 700; background: #0f1626; border: 1.5px solid; border-color: #5b3fc0 #22a5c7 #22a5c7 #5b3fc0; }
.opt .chev { margin-left: auto; color: var(--muted); }
.opt.off { opacity: .4; }
.opt small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; margin-top: 2px; }
.dline { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px; font-size: 14px; background: #0f1626; }
.dline b { margin-left: auto; }
.dline b.pos { color: var(--green); } .dline b.neg { color: var(--red); }

.toast { position: absolute; left: 16px; right: 16px; top: 14px; z-index: 40; background: #1b2238; border: 1px solid #36406a; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: down .2s ease; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes up { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes down { from { transform: translateY(-20px); opacity: 0 } to { transform: none; opacity: 1 } }

/* Friedhof & Detail */
.grave { display: flex; gap: 12px; align-items: center; }
.stone { font-size: 30px; width: 44px; text-align: center; }
.kv { display: flex; gap: 10px; }
.kv > div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
.kv small { display: block; font-size: 10.5px; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
.kv b { font-size: 19px; color: var(--amber); }
.kv b.pink { color: #f472b6; }
.story p { margin: 0 0 12px; color: #dbe3f0; font-size: 14px; }
.hl { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; font-size: 14px; }
.center { text-align: center; }
.avatar.small { width: 46px; height: 46px; font-size: 24px; border-radius: 50%; background: linear-gradient(135deg, #ec4899, #a855f7); }
.prow { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; width: 100%; margin-bottom: 10px; background: var(--card); border: 1px solid; border-color: #ec489966; }
.prow .pct { font-weight: 800; font-size: 14px; }
.prow .bar { margin-top: 6px; }
.empty { text-align: center; padding: 18px 14px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.empty b { color: #fb7185; display: block; margin-bottom: 4px; }
input[type=text], textarea { width: 100%; background: #0f1626; border: 1px solid #26304f; border-radius: 12px; color: var(--text); padding: 13px; font: inherit; outline: none; }
input[type=text]:focus, textarea:focus { border-color: var(--purple); }
textarea { min-height: 150px; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
.seg { display: flex; gap: 8px; margin: 8px 0 14px; }
.seg button { flex: 1; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #0f1626; font-weight: 700; }
.seg button.on { border-color: var(--purple); background: #1c1440; }
.toggle { width: 46px; height: 26px; border-radius: 13px; background: #2a3150; position: relative; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on { background: linear-gradient(135deg, #8b3cf5, #22d3ee); } .toggle.on::after { transform: translateX(20px); }
.hero-box { height: 150px; border-radius: 16px; margin-bottom: 14px; display: grid; place-items: center; font-size: 56px; letter-spacing: 6px; background: linear-gradient(160deg, #0f2a22, #12182c); border: 1px solid #5b3fc055; }
.kriminell { background: radial-gradient(600px 300px at 50% 0%, #4a0f1c66, transparent 70%), var(--bg); }
.kriminell h1 { color: #f43f5e; letter-spacing: 3px; }
.rep { display: flex; align-items: center; gap: 12px; }
.stars { color: #f43f5e; letter-spacing: 2px; }
.sheetlist .opt { margin-bottom: 8px; }
.dead { text-align: center; padding: 18px; }
.dead .stone { font-size: 56px; width: auto; }
.progress { margin-top: 10px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }

/* 1.4 */
#app.big { zoom: 1.12; }
#app.noanim *, #app.noanim *::before, #app.noanim *::after { animation: none !important; transition: none !important; }
.gemchip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #6366f1; color: #c7d2fe; white-space: nowrap; flex: none; }
.topbar .gemchip { font-size: 11.5px; padding: 4px 8px; }
.duo .btn.sm { padding: 11px 8px; font-size: 11.5px; }
.card.row .pill, .card.row .chip { white-space: nowrap; }
.chip.low { white-space: normal; }
/* Update-Popup */
.modal-scrim { position: absolute; inset: 0; z-index: 30; background: rgba(2,4,10,.82); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease; }
.modal { width: 100%; max-width: 360px; max-height: 92%; overflow-y: auto; background: #0d1320; border-radius: 24px; padding: 22px 18px 18px; text-align: center; border: 1px solid transparent;
  background-image: linear-gradient(#0d1320, #0d1320), linear-gradient(135deg, #a855f7, #22d3ee); background-origin: border-box; background-clip: padding-box, border-box; box-shadow: 0 20px 60px rgba(124,58,237,.35); animation: pop .25s ease; }
.modal h2 { margin: 4px 0 10px; font-size: 22px; }
.modal .when { font-size: 11.5px; font-weight: 800; letter-spacing: 1.8px; color: #c084fc; }
.modal-badge { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; background: linear-gradient(135deg, #7c3aed, #22d3ee); box-shadow: 0 8px 30px rgba(34,211,238,.35); }
.vers { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 0 0 14px; font-weight: 800; }
.vers span { padding: 5px 11px; border-radius: 999px; background: #141b2d; color: var(--muted); font-size: 13px; }
.vers span.new { background: linear-gradient(135deg, #10b981, #22d3ee); color: #04121a; }
.vers b { color: var(--muted); }
.modal-notes { text-align: left; margin: 0 0 12px; display: flex; flex-direction: column; gap: 7px; }
.modal-notes div { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #0f1626; border: 1px solid var(--line); font-size: 13.5px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes pop { from { transform: scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes rot { to { transform: rotate(360deg) } }

ys no. You are disappointed.","Do not even ask","You spare yourself the discussion and keep dreaming."],E007:["Bad Report Card","Your report card turned out worse than hoped. Your parents are waiting for your reaction.","Accept the punishment","A week of being grounded. You learn from it.","Ask for tutoring","The tutoring pays off. Your next report card is much better.","The tutoring does little and only costs you free time.","Talk calmly with your parents","You talk openly about it. You feel understood.","It ends in an argument."],E008:["Class Trip","The whole class goes away for a week.","Go and take it all in","The best week of the year with night hikes and pillow fights.","You are homesick the whole time.","A prank goes too far. You get an entry in the class register.","Stay at home","You miss a lot, but the peace and quiet does you good."],E009:["School Play","The class puts on a play. The parents are sitting in the audience.","You get the lead role and receive thunderous applause.","You play a tree and still wave proudly at the audience.","You forget your lines in front of everyone. Embarrassing."],E010:["Teacher's Pet","Your teacher is thrilled with your performance.","Your teacher gives you special encouragement. Some in the class are jealous."],E011:["First Allowance","For the first time you get regular pocket money.","Save it","You save a little every week. The piggy bank fills up.","Spend it right away","Sweets and stickers. Worth every cent."],E012:["Sibling Fight","Your sibling took your favorite toy.","Tell on them to your parents","Your parents mediate, but your sibling is angry.","Your parents side with you.","Sort it out yourself","You make up over an ice cream.","It gets even louder. Both of you get in trouble.","Take revenge","Your prank works. You laugh, your sibling cries.","Your prank is discovered. You get grounded."],E013:["Fell Out of a Tree","You climb higher than ever before.","You fall out of the tree and break your arm. Six weeks in a cast, but everyone signs it.","You get away with a few scrapes."],E014:["Sports Day","Today is sports day at school.","You win the race. A coach asks whether you want to join the club.","You end up mid-field and still have fun.","You come in last and are annoyed all day."],E015:["Kids' Birthday Party","It is your birthday and all your friends are invited.","Your birthday is a highlight with cake and games.","Half the guests cancel at short notice. It is still nice.","Your cake lands on the floor. Everyone laughs, you too."]};var Di={E016:["First Crush","For weeks you have thought of nothing but one particular person in your class.","Talk to them","You pluck up courage. From now on you text every day.","You stutter and it gets awkward. They laugh, but not in a mean way.","Write a letter","The letter goes over well.","The letter gets passed around the class. You want the ground to swallow you.","Keep a secret crush","You keep adoring from afar."],E017:["First Kiss","The moment has come.","Your first kiss is sweet and a little clumsy.","It is awkward, but you both have to laugh.","A flop. You never want to talk about it again."],E018:["New Clique","Fixed groups are forming at school. Where do you belong?","With the cool kids","You are suddenly popular, but the pressure rises.","They do not take you seriously and you feel out of place.","With the athletes","Training, tournaments and team spirit. You feel fit.","With the gamers","You game until late at night. You laugh a lot.","I go my own way","Later you find a few real friends.","You often feel lonely."],E019:["Phone Ban","Your parents want to take your phone away.","Comply","You stick with it. Your parents are surprised and a little proud.","Keep using it secretly","It works for weeks.","You get caught. Now there is a total ban for two weeks.","Argue","After a long discussion there is a compromise.","The discussion escalates into a huge fight."],E020:["Party Invitation","You are invited to a big party. Your parents know nothing about it.","Go","A great party. You meet lots of new people.","You overdo the alcohol and feel miserable the next day.","The police shut down the party. Your parents pick you up.","Decline","You stay at home and have a quiet evening.","Lie to your parents and go anyway","The lie is not discovered, the party is great.","Your parents find out. The trouble is huge."],E021:["First Summer Job","In the holidays you can earn your first own money.","Work at the supermarket","You stock shelves and earn your first money.","Deliver newspapers","Getting up early, but the pay is good.","Work at the ice cream parlor","Lots of tips, lots of ice cream."],E022:["Dare","Your friends challenge you to a dare.","Do it","You pass the dare. The clique celebrates you.","You get hurt doing it.","A passer-by calls the police. You get a warning.","Refuse","You say no. Some respect that.","They call you a coward."],E023:["Skipping School","The sun is shining outside and there is a class test at school.","Skip","A free day at the lake. Nobody notices.","The school calls your parents.","Go after all","You go and even learn something."],E024:["Puberty","Your body is changing.","Acne gives you trouble.","You shoot up in height and feel strong.","Your body changes, but you cope well with it."],E025:["Moped License","At 15 you can get your moped license.","Take the test","You pass on the first try. Freedom on two wheels.","You fail and pay for the test again.","Better not","You save the money."],E026:["Final Exams","The exams at the end of school are coming up.","Study thoroughly","You pass with a good grade.","You only just pass.","Cheat","The cheat sheet goes unnoticed.","You get caught and have to stay after school.","Rely on luck","You get lucky and pass.","You fail. You have to repeat the exam."],E027:["Fight with Parents","Things blow up at home again. It is about curfews and tidiness.","Adapt","You give in. There is peace.","Rebel","You get your way.","Grounded for two weeks.","Sleep over at a friend's","You sleep at a friend's. By morning everything is fine again.","Your parents worry and look for you. The trouble is huge."],E028:["Embarrassing Video","A video of you is circulating at school.","Take it with humor","You laugh along. The video even makes you famous.","The laughter fades fast.","Demand removal","The video is deleted, but some people saved it.","Nobody reacts. It stays online.","Take revenge","You get your revenge and nobody finds out.","It gets worse. The teachers step in."],E029:["Crossroads","What comes after school?","Go for the Abitur","You move on to upper school and want to go to university.","Start an apprenticeship","You look for an apprenticeship and want to earn your own money early.","Take a gap year","You take a year to think, travel and work."],E030:["Tattoo or Piercing Wish","You really want a piercing or a tattoo.","Ask your parents","Your parents allow it. It looks really good.","Your parents forbid it.","Get it done secretly at a friend's","It works and looks good.","It gets infected. Your parents notice immediately.","Better leave it","You let it be."]};var Ei={E031:["University Place","The application phase at the universities begins. You have your school diploma in your pocket. What do you apply for?","A dream degree (medicine, law)","You need Smarts 65+ for that","You get the place! The next years will be hard, but you are proud.","Only a place on the waiting list. You start something else later.","Rejected. The entry grade was too high.","Apply for a regular degree","Accepted! You move to a university town and take off.","Two rejections in a row. That annoys you.","No university, rather work","You decide against university. The job market is waiting."],E032:["Changing Majors","For weeks you have wondered whether your degree is really right for you.","Change majors","The new degree is much more fun, but costs a year.","The switch is chaotic, but good for you in the end.","Push through","You bite your way through. It will work out.","You end up finding some enjoyment in the material after all.","Drop out of university","You throw it in. Liberating and frightening at once."],E033:["First Own Apartment","It is time to move out of your childhood room. Where to?","Into a shared flat","The shared flat is loud, chaotic and great. You find new friends.","Your roommate empties your fridge. You argue.","Alone in a small apartment","You need at least \u20AC1,500 for deposit and furniture","Finally your own front door. The rent hurts, though.",'Stay at "Hotel Mama"',"Free laundry service and hot meals. That has its charm too."],E034:["Failed an Exam","You failed an important exam. The grade is there in black and white on the notice board.","Retake","The second time works. But it costs a year.","You barely pass and are infinitely relieved.","Quit","You give up. The frustration runs deep."],E035:["Semester Abroad","Your university offers you a semester abroad. It is a chance, but also a big effort.","Accept","A new language, new friends, a new view of the world. You return changed.","Homesickness torments you. Still, you learn a lot.","Decline","You stay at home. Better safe than sorry."],E036:["Apprenticeship","An apprenticeship would be a solid start in working life. Three companies are looking for trainees.","Trades","You get stuck in. Your hands soon know what to do.","Office","Mountains of files and Excel. But a secure job.","Hospitality","Long evenings, nice guests, lots of tips.","No apprenticeship","That is not for you."],E037:["Trouble with the Trainer","Your trainer (or lecturer) tore into you in front of everyone.","Take it","You swallow it and work harder.","Later he apologizes to you.","Complain","Management takes you seriously. A bitter aftertaste remains.","It only gets worse. The atmosphere is poisoned.","Switch company","You switch and can finally breathe again."],E038:["Side Job During Studies","Money is tight. A side job would help, but costs time.","Waiting tables","Tips and tired feet. It works.","Give tutoring","You earn well and learn something yourself.","Deliver food by bike","Quick money, soaked and exhausted.","A minor bike accident. Nothing serious.","No side job","You just about stay afloat, but have more free time."],E039:["Scholarship","A foundation is offering scholarships. Applying takes effort.","Apply","You get the funding! That takes a lot of pressure off.","It did not work out. But the application was good practice.","Cannot be bothered","You let it be."],E040:["Suspected Plagiarism","A section of your paper looks suspiciously similar to a source to the examiner.","Admit it","You admit your mistake. The paper is graded again.","The examiner shows understanding and lets it go.","Deny it","They believe you. You got lucky.","They find the proof. You are expelled from university."],E041:["Student Loan","Your account is empty, but the semester fees are due.","Take out a loan","The money is there, and so is the debt.","Ask your parents","Your parents are no longer alive","Your parents help out. You are grateful.","They help, but with a wagging finger.","Work more","You pull double shifts and pay it yourself."],E042:["Internship at the Dream Company","You landed an internship at a company you always wanted to work for.","Give it everything","You shine and get an offer for later.","You learn a lot, but they do not take you on.","Just get through it","You fetch coffee and photocopy papers. That was it."],E043:["Exam Stress","Exam season is here. Late nights, coffee and energy drinks are on the menu.","All-nighters with energy drinks","You pass brilliantly, but your body groans.","Your circulation gives out. Still a good grade.","Study steadily","You stay relaxed and pass solidly.","It is not quite enough for a top grade.","Hope for luck","Unbelievable, it just about works!","That was nothing. You retake the exam."],E044:["Graduation Ceremony","The certificate in your hand, your parents proud in the audience. What comes next?","A day full of tears, bubbly and photos. You have grown up.","The celebration fades quickly. The future scares you."],E045:["Doctoral Position","A professor offers you a doctoral position. You would be part of the research, but underpaid.","Accept","You dive into research. Four years lie ahead of you.","Decline","You would rather earn money and work practically."]};var Si={E046:["Job Interview","A company has invited you to an interview. The room is quiet, three people are looking at you.","Appear confident","You convince them across the board and get the job.","The position goes to someone with more experience.","Exaggerate a little","They believe every word. You are hired.","A follow-up question exposes your fib. Embarrassing.","Stay relaxed and honest","Your honest manner goes down well. You get a simple job.","Too relaxed. You fail."],E047:["Probation","Your probation period is ending. Today your boss says what happens next.","Passed! You are on board for good.","The probation is extended. You still have to prove yourself.","They let you go during probation. That stings."],E048:["Promotion Offered","Your supervisor asks for a talk. A position on the next level is open.","Accept","You take on more responsibility. Salary and stress rise.","The task overwhelms you at first, but you grow into it.","Decline","You stay where you are. Your evenings are worth more to you.","Negotiate more money","They agree to your demand.","They withdraw the offer. You gambled too much."],E049:["Salary Negotiation","Your salary has barely moved in two years. Time to talk to your boss.","Ask boldly","You get a decent raise!","A compromise: a little more.","Your boss is annoyed. The relationship suffers.","Ask cautiously","A small raise. At least something.","They put you off until next year.","Say nothing","You swallow your anger."],E050:["Dismissal","Your boss asks you into his office. Someone from HR is sitting next to him.","Redundancy. At least there is a severance package.","The company is cutting jobs. It hits you with no severance.","Summary dismissal over an incident. You feel treated unfairly."],E051:["Conflict with the Boss","Your supervisor makes your life hard. Every little thing is criticized.","Endure it","You hold on, but it wears you down.","Eventually he gives it a rest.","Report it","HR steps in. It gets better.","Nobody takes you seriously. The atmosphere gets colder.","Change jobs","You quit and quickly find something new.","You quit and are left on the street for a while."],E052:["Office Gossip","A rumor about you is going around the office. It is not entirely false, but told quite unfairly.","Set the record straight","You address it openly. The matter is quickly settled.","Your denial makes it really interesting.","Ignore it","The rumor fizzles out.","It sticks around stubbornly and gnaws at you.","Fight back","You start a rumor of your own. You are even.","The plan backfires. Now you are in the crosshairs."],E053:["Overtime Spiral","The project escalates. Everyone expects you to stay until it is done.","Dive in","You deliver and are celebrated for it.","You burn out and only get a thank you.","Set boundaries","You leave on time. Your boss takes it sportingly.","Your attitude is held against you."],E054:["Company Party Blunder","The Christmas party is in full swing and the drinks are flowing generously.","You give a spontaneous speech nobody forgets. You are the legend of the evening.","You dance on the table. The video does the rounds in the company.","You tell your boss something you regret the next day."],E055:["Headhunted","A competitor gets in touch: they offer you a higher salary to switch.","Switch","New company, new salary, fresh wind.","At the new employer things do not go as promised.","Stay","You stay loyal.","Get a counteroffer","Your boss ups the offer. You get more money.","He lets you go. Now you have to switch or lose face."],E056:["Start a Business","You have a business idea that will not let go. With a loan you could make it happen.","Found it","The company simply explodes. You become really rich.","A solid little business that feeds you.","The business goes bust and leaves debts.","Better not","You stay cautious."],E057:["Whistleblower Moment","You discover that your company is massaging its figures. It affects many people.","Report it","The scandal is exposed. You are celebrated as a hero, but the company fires you.","Nobody believes you and you are branded a troublemaker.","Stay silent","You keep quiet. Your conscience speaks up at night.","Someone else exposes it. You are glad not to be involved."],E058:["Transfer Abroad","Your company wants to send you to another country. New salary, new city, new language.","Accept","You emigrate and flourish.","You are homesick, but the experience is gold.","Decline","You stay at home with friends and family."],E059:["Office Romance","There has been a spark between you and a colleague for a while.","Risk it","You become a couple. Secretly at first, then officially.","It ends badly, and the office talks about it.","Better not","You stay professional."],E060:["Emergency on Duty","In the middle of your shift an emergency arrives: someone is in mortal danger and every second counts.","Act immediately","You save a life. The team applauds.","Despite every effort the patient dies. It haunts you.","Wait for instructions","It turns out fine, but you blame yourself.","Too late. There is an internal investigation."],E061:["Dangerous Operation","A risky operation is coming up. You are the first on the scene.","Advance","You step in decisively and are decorated.","You are injured, but the operation succeeds.","You suffer severe injuries.","Hold and secure","You act prudently. Everyone gets out unharmed.","Your hesitation is held against you by colleagues."],E062:["Critical Bug","Shortly before release a bug turns up that affects customer data.","Work through the night","You find the bug and save the release. Your team celebrates you.","You do not find it in time and the release falls through.","Postpone the release","The boss is not thrilled, but it was right.","Management rages. The contract falls through."],E063:["Critics and Sloppy Work","An important client (or critic) looks over your shoulder at work.","He is thrilled. A recommendation follows.","A small mistake is noticed. You learn from it.","It goes badly wrong. You get in trouble."]};var Ai={E064:["First Bank Account","You are finally allowed to open your own account. Pocket money and your first holiday jobs end up there.","Save","You put a little aside every month. The balance grows slowly.","Spend","The money is gone, but you had a lot of fun."],E065:["Credit Card Offer","Your bank sends an offer: a credit card with a generous limit, usable immediately.","Accept","You use it wisely and build up your credit score.","You spend too much. The debts grow, and so does the interest.","Decline","You stick with your account."],E066:["Tax Return","The letter from the tax office is in the mailbox. The deadline is running.","Do it yourself","You hit the right fields and get money back.","You miss some deductions and pay extra.","Hire a tax advisor","The professional gets more out than he costs.","The fee almost eats up the refund."],E067:["Rent Increase","Your landlord announces a significant rent increase.","Accept","You pay what is demanded. Your money drains away month after month.","Object","A tenants' association helps you. The increase turns out smaller.","He stays firm and you lose time and nerves.","Move out","You find something cheaper. The move is exhausting anyway.","The apartment hunt wears you down for months."],E068:["Deposit Dispute","After you move out, the landlord keeps part of your deposit.","Settle","You meet in the middle.","Sue","You win and get everything back.","The trial drags on and costs more than it brings."],E069:["Unexpected Inheritance","A notary writes to you: a distant relative you barely knew has left you something.","Accept","A considerable sum lands in your account.","A modest inheritance, but just in time.","It turns out the inheritance consists mainly of debts.","Refuse","You want nothing to do with it."],E070:["Scam Call",'A supposed bank employee calls and wants to confirm your login details "for security".',"Hang up","You hang up immediately. Nothing happens.","Give out your details","Your account is emptied.","Luckily your bank stops the transfer in time."],E071:["Buying Property","An apartment in a good location comes on the market. With a loan you could snap it up.","Buy (with a loan)","You need at least \u20AC44,000 in equity","You sign the purchase contract. Now you own an apartment and the bank owns the rest.","Keep renting","You stay flexible."],E072:["Stock Tip from a Friend","A friend swears by a stock that is supposedly going through the roof.","Go all in","You need at least \u20AC5,000","The stock doubles. You are thrilled.","It crashes. Half your money is gone.","Just a little","You need at least \u20AC500","A decent profit for little risk.","A small loss, a big lesson.","Ignore it","You stay out of it."],E073:["Buying a Car","Your old car gives up the ghost. Time for something new.","Buy a new car","You need \u20AC25,000","You drive off the lot with that new-car smell.","Buy a used car","You need \u20AC7,000","A solid bargain.","The car has hidden defects. The garage is delighted.","Lease","You get a leased car. The payments stay, the car does not."],E074:["Mountain of Debt","Debt collection letters and reminders pile up on your kitchen table.","Personal bankruptcy","You start insolvency proceedings. It is humiliating, but a real new beginning.","Restructure the debt","Counseling helps you lower the payments.","The fees only make everything worse.","Take a second job","You slog away evenings and weekends, and the debts shrink."],E075:["Retirement Planning","An advisor explains how important private provision is. You think about your pension.","ETF savings plan","Every month a little goes into the plan. That calms you.","Pension insurance","Security has its price. You still feel good about it.","Do nothing","There is time. Later."],E076:["Unexpected Bill","A bill lands in your mailbox that you did not expect.","The washing machine gives up. A new one is needed.","Dentures are needed. Insurance only pays part.","An expensive repair on the car or the heating is due."],E077:["Charity Appeal","A collection for a good cause is being held in your town. They also come to your door.","Donate","You need at least \u20AC100","You give what you can. It feels right.","Ignore","You walk on.","Collect yourself","You organize an event among friends. A lot comes together."],E078:["Lend Money to a Friend","A friend asks you for money. It is only for a short time, he promises.","Lend it","He pays everything back and invites you to dinner.","You never see the money again. The friendship suffers.","Decline","He understands, even if it is briefly awkward.","He is offended and does not get in touch for a long time."]};var zi={E079:["Dating App Match","Your phone buzzes: a match! The person looks just like in the photo.","Send a message","You text for hours. A date is set.","You get mercilessly ghosted.","Wait","You wait so long that the person stops replying.","Meet right away","Bold. You meet the same evening.","The person is completely different from what you expected. You leave after ten minutes."],E080:["First Date","The date you have been waiting for is finally here. Where to?","Cinema","You laugh, cuddle and kiss in the dark. You become a couple.","You watch the film, but the spark is missing.","Restaurant","You need at least \u20AC100","The conversation flows. The evening ends with a kiss and anticipation.","A stiff dinner, a polite goodbye.","Walk","You talk for hours through the park. Exactly right.","A nice evening, but nothing more."],E081:["Love at First Sight","On the train, in a caf\xE9 or at a party: your eyes meet a stranger's, and everything else disappears.","Talk to them","You get talking and swap numbers. It turns into a relationship.","You get turned down, but with a smile.","Do nothing","You look away. The chance is gone before it began."],E082:["Starting a Relationship","There is more than friendship between you and someone in your circle. Will it become official?","Get together officially","You become a couple. Everyone is happy for you.","You quickly realize you are better off as friends.","Stay just friends","You stay friends. That is sensible."],E083:["Jealousy Scene","A misunderstanding: you see your partner laughing with someone else. Your mood tips.","Apologize","You sort everything out. Afterwards you are even closer.","They stay cold and hurt.","Lash out","It gets loud. An ugly fight.","Take a break","Some distance does you good.","The break drags on. Something has broken."],E084:["Cheating Discovered","You find messages on your partner's phone. There is no doubt: they cheated.","Forgive","You work on it. Trust slowly returns.","You forgive, but it keeps gnawing at you.","Break up","You pack your things. It hurts, but it is right.","Take revenge","You pay them back in kind. Afterwards you feel empty.","Your action escalates and becomes public. Everyone talks about it."],E085:["Temptation","Someone in your circle shows unmistakable interest in you, even though you are taken.","Resist","You tell your partner openly. It strengthens your trust.","Give in","It stays undiscovered, but your guilty conscience does not.","It comes out. Your relationship lies in ruins."],E086:["Marriage Proposal","There is something in the air. You sense that tonight will be a special evening.","Say yes (or ask yourself)","A ring, tears, cheers. You are engaged!","A small mishap with the proposal, but the answer is yes.","Say no","It is not the right moment. The mood tips.","Ask for time","You talk openly about it. It clears up a lot.","The answer hurts your partner."],E087:["Wedding","The big day has arrived. How do you want to marry?","Big celebration","That costs \u20AC12,000","A party nobody forgets. With family, friends and dancing until morning.","Registry office","You marry in a small circle. Intimate and warm.","Elope to Las Vegas","That costs \u20AC3,000","A chapel, Elvis as witness. An adventure."],E088:["Forgot the Anniversary","Yesterday was your wedding anniversary. You only notice when your partner falls silent in disappointment.","Flowers and dinner","You need \u20AC150","The gesture reconciles you. You laugh about it.","Too late, too little. The mood stays frosty.","Apologize honestly","Your partner takes it with humor.","A thorn remains."],E089:["Couples Therapy","Your relationship is in crisis. Couples therapy could help, if you are both ready.","Go and work on it","That costs about \u20AC500","You learn to listen to each other again.","It does not help. You realize you are going separate ways.","Quit","After two sessions you stop. The silence remains."],E090:["Breakup","Nothing helps anymore: the relationship is over.","You part on good terms. It hurts, but you stay friendly.","You are left. It hits you hard."],E091:["Divorce","Your marriage is over. Now begins the fight over the house, the account and everything in between.","Settle amicably","You split fairly. It stays bitter, but without a war of the roses.","Go to court","You win out, but the price is high.","The trial devours money and nerves."],E092:["Ex Gets in Touch","Your phone shows a familiar name: your ex has texted you.","Reply","A nice conversation, without grudges. You make peace.","Old wounds reopen.","Block","Chapter closed. You feel relieved.","Meet up","The reunion feels good, even if nothing more is possible.","You argue like before. That was a mistake."],E093:["Long-Distance Relationship","Your partner got a job in another city. The distance tests your relationship.","Follow them","You move together to the new city. A fresh start as a couple.","The move is chaotic and you regret it.","Hang in there","You stay in touch and see each other at weekends. You make it.","The distance consumes you.","End it","You part as friends. You remember each other fondly."],E094:["Moving In Together","You are together almost every day. Time for the next step?","Move in together","Everyday life brings you closer. You are a well-oiled team.","Toothpaste tubes and the dishwasher cause arguments.","Wait a bit","You take your time."]};var xi={E095:["Pregnancy","One test, two lines. Life takes a new turn.","A surprise you first have to digest. Then joy wins out.","Long awaited! You fall into each other's arms in tears."],E096:["Unfulfilled Wish for a Child","You have been trying for years. It simply does not work.","Try treatment","That costs about \u20AC6,000","You succeed! A miracle.","It does not work this time either. You are exhausted.","Adopt","That costs about \u20AC8,000","After a long wait a child moves in with you. Your family is complete.","Accept it","You accept the situation and enjoy your life as a couple.","The grief lingers. Only slowly do you manage to laugh again."],E097:["Birth","It is time. Labor begins and you are in the middle of the delivery room.","Your child is born healthy. You hold it in your arms for the first time and time stands still.","There are complications, but in the end everyone is fine. A nail-biter."],E098:["Sleepless Nights","The baby is crying. It is three in the morning. Again.","You are a zombie, but your baby smiles at you. That makes up for everything.","Exhaustion frays your nerves. You argue more than usual."],E099:["Tantrum Phase","Your child screams in the supermarket and throws itself on the floor. Everyone is watching.","Stay strict","You stand firm. After ten minutes there is peace.","The child screams even louder. You flee the stares.","Give in","You buy the sweets. The quiet was worth it, but next time will be harder."],E100:["Parents' Evening","Parents' evening at school. Plastic chairs, coffee and plenty to talk about.","The teacher praises your child to the skies. You burst with pride.","There is criticism of your child's behavior. You take it to heart.","An argument with other parents escalates."],E101:["Child Wants a Pet","For weeks your child has been begging for a pet.","Say yes","You need \u20AC300","A dog or a cat moves in. The child is delighted.","Put them off",'You say "maybe later". The child sulks.',"No","A clear no. The child is angry, but understands eventually."],E102:["Teenager Rebels","Your teenager comes home late and skipped school.","Talk","You talk openly and your child opens up.","They shut you out and stay silent.","Punish","The child obeys, but is furious for days.","The punishment makes everything worse. A huge fight breaks out.","Let go","You trust that your child will find their way."],E103:["Child Moves Out","Your child packs the last boxes. The house goes quiet.","The empty room hurts, but you are endlessly proud.","Suddenly you have time for yourself and your partner. It feels new."],E104:["Visiting the In-Laws","The weekend at the in-laws is coming up. There are expectations, questions and roulades.","Stay charming","You score with politeness. Your mother-in-law raves about you.","Despite your efforts a cool undertone remains.","Escalate","One wrong word and the mood tips. You are silent on the drive back."],E105:["Christmas Fight","The family dinner turns sour when someone brings up a touchy subject.","Mediate","You defuse the situation. Everyone breathes a sigh of relief.","You go from mediator to target.","Join the fight","You add fuel to the fire. The evening ends in chaos.","Leave early","You pack your things and disappear. The peace is yours."],E106:["Parents Need Care","Your parents can no longer manage everyday life on their own. Someone has to take care of them.","Care for them yourself","You look after them day and night. Your strength fades, but closeness grows.","Hire a care service","You need \u20AC3,000","Professional help relieves you. Your visits are more relaxed again.","Move to a care home","Your parent settles into the home. You visit each other regularly.","The parting is hard. You struggle with guilt."],E107:["Death of a Parent","The funeral is over. Now the estate has to be settled.","Settle everything peacefully","You divide everything fairly. Grief connects you.","There is friction, but you agree.","Insist on the inheritance","You get more than expected, but the family hardly speaks to you anymore.","The inheritance dispute drags on for years."],E108:["Sibling Needs Help","Your brother or sister is in a bind and calls you.","Give money","You need \u20AC1,500","You help. You are closer than before.","The money disappears. No thanks either.","Let them stay with you","A few weeks of chaos, then you are closer than ever.","Weeks turn into months. You have had enough.","Lend an ear","You listen, and sometimes that is enough."],E109:["Grandchild","Your child announces that you are becoming a grandparent.","You hold your grandchild in your arms. A new role, new drive."]};var Ti={E110:["New Neighbors","New people are moving into the house across the street. The moving van blocks half the road.","Greet them warmly","You get talking and click right away. A new friendship begins.","A nice chat over the garden fence. Nothing more, but it feels good.","Keep your distance","You just nod and go inside. The neighbors stay strangers.","You come across as unfriendly. There is whispering behind your back in the stairwell."],E111:["Neighbor Dispute","The hedge is too tall, the music too loud or someone is parked in your space. The tone gets rough.","Talk calmly","After a clarifying talk over coffee the dispute is settled.","The neighbor stonewalls. An uncomfortable atmosphere remains.","Get a lawyer","That costs about \u20AC1,500","You win in court. The bill hurts anyway.","The settlement is meager. You pay the costs and the neighbor no longer greets you.","Take revenge","Your little prank works. The neighbor gives in meekly.","It escalates. There is a complaint and a warning from the property management."],E112:["Friend in Need","In the middle of the night your phone rings. A friend urgently needs help.","Drive over immediately","You are there when he needs you. Your friendship deepens.","The night is long and heavy, but you help as best you can.","Call back tomorrow","By morning the problem is solved. He says nothing, but you sense the disappointment.","He managed without you and does not hold it against you."],E113:["Friendship Breaks Apart","An argument about something small grows into something big. Suddenly you are no longer friends.","You part in anger. The silence afterwards hurts more than the words.","One of you makes the first move, and you reconcile the same evening.","In hindsight he was never a real friend. You feel strangely relieved."],E114:["Friend's Wedding","An invitation is in the mailbox. A close friend is getting married.","Attend and give a speech","Your speech makes the whole hall laugh and cry. You are the star of the evening.","You stumble embarrassingly. Everyone laughs with you, not at you.","Attend as a guest and party","A beautiful day. You dance until your shoes smoke.","Too much bubbly. The next morning is awful, but the memories remain.","Decline","You send a small gift. He is disappointed you were not there."],E115:["Joining a Club","A colleague invites you to his club: sports, shooting or music.","Join","You find a connection immediately. Club life gives you support and friends.","The meetings are more tiring than expected. But a few nice people are there.","Not interested","You prefer to keep to yourself. Club life is not for you."],E116:["Bachelor Party","A friend is getting married soon, and you are supposed to organize the send-off.","Wild party","That costs about \u20AC400","A night for the ages. Nobody remembers everything, but everyone laughs.","The night ends in a cell. The groom has to marry with a bandage.","The groom looks truly bewildered for the first time in his life. Perfect.","Quiet trip","A weekend in the mountains with barbecue and campfire. Exactly right.","It rains all weekend. You play cards and it is lovely anyway."],E117:["Class Reunion","Twenty years after graduation someone invites you to a class reunion.","Show off","You tell big stories. The old classmates are amazed and you enjoy it.","Someone knows the truth and exposes you. It goes quiet at the table.","Be honest","You tell how it really went. Suddenly everyone opens up and it becomes a great evening.","It is a nice but shallow evening. People promise to meet up that never happens.","Stay away","You stay at home. Maybe it was better that way, maybe not."],E118:["Secret Betrayed","A friend has confided something explosive to you. Now someone is digging.","Stay silent","You keep it to yourself. Your friend finds out and trusts you even more.","The pressure is high, but you stay firm. It costs you nerves.","Spill it","The story makes the rounds. Your friend finds out and cuts off contact.","Nobody notices. But the guilty conscience stays."],E119:["Volunteering","The food bank, the fire brigade or the animal shelter are looking for helpers. You could sign up.","Join in","The work is hard but meaningful. You come home tired but happy.","The effort pushes you to your limits, but you are proud of yourself.","Donate instead of time","That costs about \u20AC200","Your donation is gratefully accepted. A good feeling.","No time","Daily life eats your days. Maybe later."],E120:["Group Chat Drama","In the group a sentence is misunderstood. Within minutes the messages are flying.","Clear it up","You call those involved. With a laugh everything is out of the world.","The talk drags on, but in the end everyone has made up.","Leave the group","You are out. Suddenly it is quiet, and you feel strangely empty.","The peace does you good. Whoever is a real friend will get in touch anyway."],E121:["Regular Pub","For months you have sat at the same bar almost every Friday. The landlord knows your drink.","The pub becomes your second living room. You truly feel at home there.","The evenings get long, and so does the bill. But the laughter does you good."]};var Yi={E122:["Flu Wave","Sore throat, fever, aching limbs. The flu wave has caught you.","Recover properly","A week in bed, tea and soup. Afterwards you feel like new.","It takes longer than expected, but in the end you are fit again.","Work through it","Only possible with a job","You drag yourself through the week. The boss praises your commitment.","You infect half the office and end up in bed with pneumonia."],E123:["Childhood Illness","Chickenpox, mumps or an ear infection. You are laid up for a week.","Mom makes soup and reads to you. After a week you are back on your feet.","It drags on. You miss a lot of school, but recover completely."],E124:["Allergy Discovered","Sneezing, rash, shortness of breath. The doctor runs a test and now knows what is going on.","Hay fever. Every spring is now a torment.","A nut allergy. You learn to read ingredient lists by heart.","A pet hair allergy. The dream of a pet is over."],E125:["Dentist Visit","The tooth has been throbbing for days. The dentist looks worriedly into your mouth.","A simple filling. You are out again after half an hour.","Root canal. It hurts, but insurance pays for everything.","The tooth has to go and an implant goes in. Insurance covers the cost."],E126:["Back Pain","Getting up, a stab shoots through your back. The disc is acting up.","Physiotherapy","That costs about \u20AC400","After weeks of exercises it gets much better. You now watch your posture.","It improves only slowly. Your back stays sensitive.","Swallow painkillers","The pills help and you can carry on as before.","The problem drags on. Eventually everything gets worse.","Surgery","That costs about \u20AC3,000","The surgery succeeds and after rehab you are almost pain-free.","There are complications. You have to go under the knife a second time."],E127:["Burnout","In the mornings you can barely get out of bed. You are empty, burnt out and exhausted.","Take time off","Three months off. You learn to set boundaries and return stronger.","The break helps, but colleagues talk. Your reputation suffers.","Keep going","You grit your teeth. Somehow it works.","Your body pulls the emergency brake. You collapse at the office.","Change jobs","You quit. The relief is huge, even if the future is open.","You quit and soon find something more relaxed."],E128:["Depressive Phase","Nothing brings joy anymore. The days blur, the drive is gone.","Seek help","With therapy and patience the light returns. It was the right step.","The road is long, but you are no longer alone with it.","Talk to friends","You need friends for that","Your friends listen and stay with you. That carries you through the hard time.","It helps a little, but not more.","Suppress it all","With time the fog lifts on its own.","You withdraw. It gets darker before it slowly gets brighter."],E129:["High Blood Pressure","The doctor measures your blood pressure and frowns. The reading is clearly too high.","Change your lifestyle","You eat better and move more. The numbers drop and you feel fitter.","You hold out for a while, then the old routine creeps back in.","Take pills","The pills keep the pressure in check. An annoying but effective routine.","Ignore it","You wave it off. The pressure stays high without you noticing.","You feel strangely carefree. Your body pays later."],E130:["Diabetes Diagnosis","Constant thirst, constant tiredness. The blood values leave no doubt.","Type 2 diabetes. With diet and exercise you get it under control.","You now have to take medication permanently and change your daily life."],E131:["Heart Attack","Pressure on the chest, cold sweat, shortness of breath. Someone calls the emergency doctor.","The emergency doctor arrives just in time. After rehab you live more consciously.","The treatment works, but your heart is permanently weakened.","The emergency doctor arrives too late. Your heart stops."],E132:["Stroke","Suddenly everything blurs. Your arm goes numb and speech fails.","Quick help saves you. After weeks of rehab only a slight weakness remains.","A severe stroke. You have to learn to speak and walk again.","All help comes too late. You do not wake up again."],E133:["Cancer Suspicion","A suspicious spot, a second appointment, anxious days of waiting for the result.","All clear! The result is harmless. You celebrate life like never before.","The diagnosis is cancer. The world collapses briefly, then the fight begins."],E134:["Cancer Treatment","Surgery, chemo, radiation. Your daily life consists only of appointments.","After agonizing months you are cancer-free. Life tastes good again.","The treatment only partly helps. You live with the illness.","The cancer is too advanced. You lose the fight."],E135:["Sports Injury","A wrong step, a crack in the knee, then pain. The cruciate ligament is torn.","Surgery and rehab","The operation works. After rehab you are back on your feet.","Rehab drags on forever. You never do sports like before.","Treat conservatively only","It heals somehow. The knee stays unstable.","The knee constantly causes problems. Later you need the surgery after all."],E136:["Appendix Surgery","Stabbing pain in the lower right abdomen. In the emergency room everything happens fast.","The appendix is removed. After a few days you are back home.","It had already burst. You stay two weeks in the hospital."],E137:["Pandemic","A new virus is spreading. Shops close, schools stay empty, and everyone stays home.","Caution, distance and mask","You get through well. The isolation weighs on your mood, but you stay healthy.","Despite all caution you catch it mildly. You recover quickly.","Carry on as normal","You stay healthy and enjoy the freedom, though with looks from others.","You fall seriously ill and lie flat for weeks.","The course is severe. You will not be properly healthy for a long time."],E138:["Tick Bite","After the hike you discover a tick on your leg. It has already latched on.","You remove it in time. It stays with a red spot.","Weeks later come joint pain and tiredness. It is Lyme disease."],E139:["Poor Eyesight","The letters on the board blur. At the eye test the matter is clear.","Glasses","The world is suddenly razor sharp. The glasses even suit you.","You feel uncomfortable with glasses, but you finally see clearly again.","Contact lenses","Putting them in is a struggle, but later you are thrilled.","Eye surgery","That costs about \u20AC3,500","After the laser treatment you see perfectly again.","Dry eyes bother you, but the vision is good."],E140:["Sudden Hearing Loss","Suddenly a rushing in the ear. On one side everything is muffled.","Rest and infusions","With rest and infusions the hearing returns after days.","A faint ringing remains. You learn to live with it.","Carry on","It disappears on its own.","The ringing in your ear stays permanently. The stress was too much."],E141:["Sleep Disorder","Night after night you lie awake. During the day you are a wreck.","Sleep lab","That costs about \u20AC500","The cause is found, and with new habits you sleep well again.","The examination finds nothing unusual. It was helpful anyway.","Home remedies","Valerian, tea and going to bed early. It slowly gets better.","Nothing really helps. The tiredness stays.","Sleeping pills","You sleep like a rock, even if you feel dazed in the morning.","You become dependent on the pills. It is hard to stop them again."],E142:["Health Check-up","The letter from your family doctor reminds you: time for a check-up.","Go","Everything is fine. You go home with a good feeling.","The doctor finds something suspicious early. Thanks to the check-up it is treatable.","Put it off","You have other things to do. The letter ends up in the trash.","A year later a problem is already far advanced."],E143:["Organ Transplant Needed","Your doctor talks about a waiting list. Without a new organ it gets critical.","After a long wait the liberating call comes. The operation succeeds.","You wait and wait. Your family supports you, and in the end it works after all.","The organ comes too late. You die on the waiting list."]};var Mi={E144:["Car Accident","A moment of inattention, a crash, shards of glass. Your car is sitting sideways on the road.","Just bodywork damage. The shock sits deeper than the dent.","You have bruises and whiplash. Insurance only pays in part.","A serious accident. You spend weeks in the hospital.","The impact was too violent. You do not survive the accident."],E145:["Bicycle Accident","A wet bend, a slip. You fly over the handlebars.","A scraped hand and a bruise. Nothing more happened.","The helmet saves you from worse. For a few days you are dazed.","A broken wrist and a night in the hospital."],E146:["Apartment Fire","The smoke alarm shrills. Flames shoot out of the kitchen, caused by a stove or a candle.","Put it out yourself","You smother the flames with a blanket. A soot stain remains.","The fire spreads. You barely escape with burns.","Flee and call the fire brigade","The fire brigade is quick. The damage stays limited.","The apartment is uninhabitable. For weeks you are put up with friends."],E147:["Burglary","You come home, the door is open. Drawers lie on the floor, jewelry and laptop are gone.","Call the police","Insurance replaces part of it. There is no trace of the culprits.","The police catch the culprits, and you get a lot back.","Install an alarm system","That costs about \u20AC1,800","You now feel safer. The alarm system is expensive, but reassuring.","Shrug it off","You are annoyed, but say nothing. The feeling of insecurity stays."],E148:["Water Damage","A pipe has burst. Water drips from the ceiling and the wallpaper peels off.","Insurance covers almost everything. You just have to deal with tradesmen for a while.","Insurance refuses to pay. The dispute over the costs drags on."],E149:["Skiing Accident","On the slope someone crashes into you from behind. You slide down the hill.","You get off with a fright, but the vacation is over.","The leg is broken. You experience the helicopter from the inside.","A heavy fall. It takes you months before you can walk again."],E150:["Accident at Work","At work you slip or a machine fails. A stabbing pain runs through your body.","A minor injury. You are on sick leave for a few days.","The employers' liability association covers the treatment. You are out for weeks.","A serious injury sets you back for a long time. Your employer shows little understanding."],E151:["Nearly Drowned","While swimming a current pulls you out. You paddle, but the shore gets smaller.","A stranger pulls you out. You cough up water and cry with gratitude.","Friends rescue you just in time. The shock runs deep.","The current is too strong. You go under and do not come back up."],E152:["Lost While Hiking","Fog rolls in, the path disappears. Your phone has no reception.","Wait","You stay calm. After a few hours the fog lifts and you find the path.","It gets cold and dark. A search party finds you at dawn.","Keep walking","You find a trail and reach the hut. A bit of luck was involved.","You slip and get hurt. Mountain rescue saves you.","Call for help","With your last bit of reception you reach mountain rescue. They pick you up. Embarrassing, but safe."],E153:["Natural Disaster","Flood, storm or earthquake. The water rises and the sirens howl.","Evacuate","You get to safety in time. A lot of chaos remains.","Neighbors help each other. The solidarity does you good.","Stay and save things","You save a lot and earn everyone's respect.","The water comes too fast. Your belongings are lost.","You are swept away by the floods."],E154:["Food Poisoning","Last night's food was apparently no longer good. You spend the night at the sink.","Two days of bed rest, then it is over.","You end up in the clinic from dehydration."],E155:["Accident Witness","In front of you a scooter crashes into a car. The rider lies dazed on the road.","Give first aid","You hold on until the ambulance arrives. The man survives thanks to you.","You help as best you can. The images haunt you for weeks.","Call emergency services","You immediately call emergency services and stay on the phone until help arrives.","Walk on","You walk on and feel bad about it. The sight will not leave you."]};var $i={E156:["Shoplifting","The store is crowded, the cashier distracted. The item lies right in front of you.","Leave it","You leave with nothing. Your conscience is clear.","Pocket it","Nobody notices. Your heart races, but you are through.","A store detective grabs your arm. There is a report and an embarrassing talk."],E157:["Fare Dodging","Two inspectors show up on the train. You have no ticket.","Pay","You pay the \u20AC60 and are annoyed with yourself.","Argue","The inspector softens. You get off with a warning.","The argument gets you nowhere. You pay, and there is a record.","Run","You jump off at the next station and are gone.","They catch up with you. There is a report."],E158:["Caught by a Speed Camera","A bright flash at the roadside. You were clearly too fast.","A fine of \u20AC80. Annoying, but bearable.","Two points on your license. That really hurts.","You lose your driver's license for a month. Without a car it is difficult."],E159:["Drunk Driving","You have had a few beers. The car is parked right outside the door.","Take a taxi","You leave the car. The taxi costs \u20AC25, but it is safe.","Drive yourself","Nothing happens. Your heart pounds the whole drive.","A police check. The license is gone, the fine hefty.","You cause an accident. People are hurt and you get a prison sentence."],E160:["Pickpocketed","In the crowd you suddenly feel a lightness in your jacket pocket. Your wallet is gone.","File a report","The police note everything down, but nobody finds the thief.","Your ID turns up in a mailbox. The money stays lost.","Chase them","You catch the thief and get everything back.","You lose him in the crowd. You stand there out of breath.","Write it off","You block the cards and carry on. Annoying, but life goes on."],E161:["Graffiti","The gray wall begs for color. Your friends already have the cans ready.","Join in","You leave a masterpiece and disappear unnoticed.","The police catch you red-handed. You get community service.","Stay out of it","You just watch and keep lookout. Nothing happens."],E162:["Becoming a Lay Judge","A letter from the district court: you were drawn as a lay judge.","Judge fairly","You listen closely and judge with reason. A formative experience.","The case hits close to home. The responsibility weighs on you.","Let yourself be swayed","You feel sorry for the defendant. Your verdict is milder than it should be. It gnaws at you."],E163:["Witness in Court","You are supposed to testify as a witness about an incident you observed.","Testify honestly","Your testimony helps the court. You fulfill your civic duty.","The perpetrator shoots you angry looks. For weeks you feel watched.","Lie","Nobody notices anything.","Your contradiction is exposed. You are punished for false testimony."],E164:["Tax Evasion Discovered","The tax office asks questions about income you never declared.","Voluntary disclosure","You pay back and stay unpunished. The sum hurts, your sleep improves.","Deny","The authority lets it rest. You were lucky.","The tax investigators come. There are penalties and probation."],E165:["False Suspicion","The police are at your door. You are supposed to have done something you had nothing to do with.","Hire a lawyer","That costs about \u20AC1,500","Your lawyer clears it up quickly. You are exonerated.","It drags on. In the end you are acquitted, but your reputation is dented.","Clear it up yourself","You gather evidence and prove your innocence.","You get tangled in contradictions. It takes months until the charges are dropped."],E166:["Parking Ticket","A slip of paper is stuck under your windshield wiper. You parked illegally.","Pay","You pay the \u20AC35 and drive on.","File an objection","Your objection succeeds. The fine is waived.","The objection is rejected, and proceeding costs are added."],E167:["Brawl","One word leads to another. Suddenly your opponent clenches a fist.","De-escalate","You raise your hands and leave. The situation calms down.","He keeps ranting, but it stays with words.","Join in","You win the fight, but with a black eye.","You take a beating and a complaint on top of it.","It ends in the hospital. You have a criminal record for assault.","Run away","You run until you are out of breath. Embarrassing, but healthy."],E168:["Complaint Against Neighbor","The neighbor reported you for disturbing the peace. The public order office summons you.","A warning is enough. You turn the music down.","A fine and a poisoned neighborhood.","The complaint is dropped, the neighbor embarrasses himself."],E169:["Probation Violation","During your probationary period a check catches you with too many drinks or too high a speed.","Training course and an extension of the probation. Expensive, but lenient.","You have to hand in your license. Without a car it gets tight."],E170:["Probation Conditions","You are on probation. Any mistake could bring you back before the judge.","Follow the rules","You hold on. The probation runs without incident.","The probation officer praises you. You find new courage.","Break the rules","Nobody notices. You were lucky.","Your violation is exposed. You go back behind bars."]};var Fi={E171:["The First Cigarette",'Behind the schoolyard someone hands you a cigarette. "Come on, dare."',"Try it","You cough your lungs out and leave it at that.","One time becomes several. You are now a smoker.","Refuse","You shake your head. The others shrug, and everything stays as it is."],E172:["Quitting Smoking","You have smoked for years. The cough gets worse and the pack more expensive.","Quit with patches","That costs about \u20AC100","Withdrawal is hard, but you make it. You breathe freely again.","After two weeks you reach for a cigarette again.","Cold turkey","Gritting your teeth. After a month the urge is almost gone.","You cannot hold out and are a smoker again.","Not at all","Once is never. The smoking stays, and so does the cough."],E173:["After-Work Beer","One glass after work becomes two, then three. It feels like a reward.","Counteract","You notice where this leads and cut back. Good.","You try, but keep slipping back into the old routine.","Keep drinking","The evening belongs to you. Only the body grumbles in the morning.","It becomes a habit. Friends and partner worry."],E174:["Sports Betting",'A buddy swears by a sure tip. "Just 100 euros, I promise."',"Place the bet","The tip hits. You win three times your stake!","The game turns in the last minute. Your stake is gone.","Hands off","You leave it. Maybe he meant well."],E175:["Casino Night","The lights, the chips, the click of the ball. The night at the casino begins.","Go with a budget","You lose exactly your budget and leave with a smile.","A good evening! You go home with winnings.","A jackpot! The croupier is amazed.","All on red","Red! You double everything and leave before luck turns.","Black. Your money disappears with a click."],E176:["Gaming Addiction","One more round, just one more. It is three in the morning again.","Practice discipline","You set limits and stick to them. It works surprisingly well.","It is hard, but after a few weeks you have it under control.","Keep gaming","A new record! Your team celebrates you, your sleep does not.","Grades and job suffer. You are constantly tired."],E177:["Shopping Addiction","One click and the package is on its way. Packages are piling up at your place.","Hit the brakes","You delete the shopping apps. Your account recovers.","You cannot keep it up, but you cut back.","Keep shopping","The joy lasts only briefly. Your account groans.","Debts pile up. You get the first reminders."],E178:["Doomscrolling","You only wanted to glance at your phone briefly. Now the night is almost over.","Put the phone away","You put the phone aside and sleep well.","Your thoughts keep circling, but you hold on.","Keep scrolling","Time flies. Afterwards you are empty and tired.","You only read bad things. The world looks dark to you."],E179:["Detox and Rehab","Your circle says it openly: this cannot go on. You need help.","Go to rehab voluntarily","That costs about \u20AC1,000","After weeks you are clean. You leave stronger and with new courage.","Rehab helps, but doubt remains. It will be a long road.","Try alone","You make it alone. It is the hardest time of your life.","Without help you fail. The pattern keeps its hold on you.","Carry on","You do not listen. The addiction keeps eating away at you."],E180:["Relapse","It is a hard day. The old temptation is in front of you again.","Hold firm","You call a friend and the danger passes. Pride fills you.","It takes all your strength, but you stay strong.","Give in","Just this once. Then again and again. The relapse is here.","You give in, but regret it immediately and seek help."]};var Li={E181:["Vacation Trip","Finally vacation! You can hardly decide where the trip should go.","Beach vacation","That costs about \u20AC800","Sun, sea and sand. You return rested and tanned.","A sunburn and a stomach bug. Still, it was lovely.","Mountain hiking","That costs about \u20AC400","Fresh air, great views. You feel reborn.","Constant rain at the hut. You play cards and laugh anyway.","City trip","That costs about \u20AC600","Museums, caf\xE9s, alleys. You learn a lot and come home inspired.","The city is crowded and expensive. Still, nice pictures remain.","Stay at home","You stay at home. Cozy, but far from adventure."],E182:["Missed Flight","Strike at the airport, traffic jam on the highway. Your plane takes off without you.","Rebook","You rebook and arrive
